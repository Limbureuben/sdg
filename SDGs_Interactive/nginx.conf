server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index Index.html;

    location / {
        try_files $uri $uri/ /Index.html;
    }

    # Static assets are immutable in this export and can be cached safely.
    location ~* \.(?:js|jpg|jpeg|png|gif|svg|ico|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
